name: Build

on:
  push:
    branches: [ main, master ]
  pull_request:
    branches: [ main, master ]
  workflow_dispatch:

jobs:
  build:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4

      - name: Setup .NET 10
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: '10.0.x'

      - name: Restore
        run: dotnet restore GamingHub.slnx

      - name: Build
        run: dotnet build GamingHub.slnx -c Release --no-restore

      - name: Publish (self-contained x64)
        run: dotnet publish src/GamingHub.App/GamingHub.App.csproj -c Release -r win-x64 --self-contained true -o publish

      - name: Upload build artifact
        uses: actions/upload-artifact@v4
        with:
          name: GamingHub-win-x64
          path: publish/
