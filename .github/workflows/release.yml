name: Release

# Erstellt ein Velopack-Paket und veröffentlicht es als GitHub-Release.
# Die App zieht sich Updates automatisch aus den Releases dieses Repositories.
on:
  push:
    tags:
      - 'v*'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  release:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4

      - name: Setup .NET 10
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: '10.0.x'

      - name: Read version
        id: version
        shell: pwsh
        run: |
          $content = Get-Content Directory.Build.props -Raw
          if ($content -match '<Version>([^<]+)</Version>') { $v = $Matches[1] } else { $v = '0.0.0' }
          "value=$v" >> $env:GITHUB_OUTPUT

      - name: Install vpk (Velopack CLI)
        run: dotnet tool install --global vpk

      - name: Publish
        run: dotnet publish src/GamingHub.App/GamingHub.App.csproj -c Release -r win-x64 --self-contained true -o publish

      - name: Build Portable ZIP (Ordner, ohne Single-File-Selbst-Extraktion)
        shell: pwsh
        run: |
          # Bewusst KEIN PublishSingleFile: die selbst-entpackende EXE
          # wird von Antiviren-Programmen öfter fälschlich gelöscht.
          dotnet publish src/GamingHub.App/GamingHub.App.csproj -c Release -r win-x64 --self-contained true -o portable/publish
          Compress-Archive -Path portable/publish/* -DestinationPath portable/GamingHub-win-Portable.zip -Force

      - name: Pack with Velopack
        shell: pwsh
        run: |
          vpk pack `
            --packId GamingHub `
            --packVersion ${{ steps.version.outputs.value }} `
            --packTitle "Gaming Hub" `
            --packAuthors "jggaming25" `
            --runtime win-x64 `
            --packDir publish `
            --mainExe GamingHub.App.exe `
            --icon src/GamingHub.App/Assets/logo.ico `
            --outputDir Releases

      - name: Remove Velopack Portable ZIP
        shell: pwsh
        run: |
          # vpk erzeugt zusätzlich ein SELBST-ENTPACKENDES Portable-ZIP – genau die Art,
          # die Antiviren-Programme gerne löschen. Entfernen, damit ausschließlich unser
          # AV-freundliches Ordner-ZIP (portable/GamingHub-win-Portable.zip) ausgeliefert wird.
          Get-ChildItem Releases -Filter *Portable*.zip -ErrorAction SilentlyContinue | Remove-Item -Force -ErrorAction SilentlyContinue

      - name: Generate SHA-256 checksums
        shell: pwsh
        run: |
          $files = Get-ChildItem Releases, portable -File | Sort-Object Name
          $files | ForEach-Object {
            $hash = (Get-FileHash $_.FullName -Algorithm SHA256).Hash
            "$($hash.ToLower())  $($_.Name)"
          } | Out-File checksums.txt
          Get-Content checksums.txt

      - name: Install GitHub CLI
        run: |
          winget install --id GitHub.cli -e --accept-source-agreements --accept-package-agreements
        shell: pwsh

      - name: Publish GitHub Release
        run: |
          gh release create "v${{ steps.version.outputs.value }}" \
            --title "Gaming Hub v${{ steps.version.outputs.value }}" \
            --notes "Full Changelog: https://github.com/jggaming25/Gaming-Hub/compare/v0.5.6...v${{ steps.version.outputs.value }}" \
            Releases/* \
            portable/GamingHub-win-Portable.zip \
            checksums.txt
        env:
          GH_TOKEN: ${{ github.token }}
