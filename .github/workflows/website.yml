name: Website

on:
  push:
    branches: [ main ]
    paths:
      - "website/**"
      - ".github/workflows/website.yml"
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 20

      - name: Install dependencies
        working-directory: website
        run: npm install

      - name: Download latest release assets (self-hosted download)
        working-directory: website
        continue-on-error: true
        shell: bash
        run: |
          mkdir -p public/download
          gh release download latest \
            --repo jggaming25/Gaming-Hub \
            --pattern "GamingHub-win-Setup.exe" \
            --pattern "GamingHub-win-Portable.zip" \
            --dir public/download
          ls -lh public/download

      - name: Build
        working-directory: website
        env:
          VITE_SUPABASE_URL: ${{ secrets.VITE_SUPABASE_URL }}
          VITE_SUPABASE_ANON_KEY: ${{ secrets.VITE_SUPABASE_ANON_KEY }}
        run: npm run build

      - uses: actions/configure-pages@v5

      - uses: actions/upload-pages-artifact@v3
        with:
          path: website/dist

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v4
